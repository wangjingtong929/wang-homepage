<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wang's Personal Website</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:"Microsoft YaHei",sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(-45deg,#667eea,#764ba2,#6dd5ed,#2193b0);
    background-size:400% 400%;
    animation:gradientBG 12s ease infinite;
    padding:30px 15px;
}

@keyframes gradientBG{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.card{
    background:rgba(255,255,255,0.16);
    backdrop-filter:blur(12px);
    padding:35px;
    border-radius:24px;
    text-align:center;
    color:white;
    box-shadow:0 8px 32px rgba(0,0,0,0.25);
    max-width:680px;
    width:100%;
    animation:fadeIn 1.5s ease;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

h1{
    font-size:3.2em;
    margin-bottom:10px;
}

.subtitle{
    font-size:1.3em;
    margin-bottom:20px;
}

.typing{
    border-right:3px solid white;
    white-space:nowrap;
    overflow:hidden;
    width:0;
    margin:22px auto;
    font-size:1.4em;
    animation:
        typing 4s steps(28,end) infinite alternate,
        blink .8s infinite;
}

@keyframes typing{
    from{width:0}
    to{width:300px}
}

@keyframes blink{
    50%{border-color:transparent}
}

.skills{
    margin-top:20px;
}

.skill{
    display:inline-block;
    margin:8px;
    padding:10px 20px;
    border-radius:30px;
    background:rgba(255,255,255,0.22);
    transition:0.3s;
}

.skill:hover{
    transform:scale(1.1);
    background:rgba(255,255,255,0.38);
}

.section{
    margin-top:25px;
    padding-top:18px;
    border-top:1px solid rgba(255,255,255,0.25);
}

button{
    margin:8px;
    padding:10px 18px;
    border:none;
    border-radius:25px;
    background:white;
    color:#333;
    font-size:1em;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.08);
    background:#ffeaa7;
}

input{
    margin-top:10px;
    padding:10px;
    border:none;
    border-radius:20px;
    width:70%;
    max-width:320px;
    text-align:center;
    outline:none;
}

.result{
    margin-top:12px;
    min-height:24px;
    color:#fff;
}

.footer{
    margin-top:25px;
    font-size:0.95em;
    opacity:0.9;
}

@media(max-width:600px){
    h1{
        font-size:2.4em;
    }

    .typing{
        font-size:1.1em;
    }

    input{
        width:90%;
    }
}
</style>
</head>

<body>

<div class="card">
    <h1>Wang</h1>

    <div class="subtitle">Student & Lifelong Learner</div>

    <p>你好，我是 Wang，一名学生。</p>

    <div class="typing">Learning • Coding • Growing</div>

    <div class="skills">
        <span class="skill">📐 Mathematics</span>
        <span class="skill">💻 Programming</span>
        <span class="skill">🚀 Personal Growth</span>
    </div>

    <div class="section">
        <h2>互动功能</h2>
        <button onclick="showAbout()">了解我</button>
        <button onclick="changeTheme()">切换背景</button>
    </div>

    <div class="section">
        <h2>留言板</h2>
        <input type="text" id="messageInput" placeholder="请输入你的留言">
        <br>
        <button onclick="submitMessage()">提交留言</button>
        <p id="messageResult" class="result"></p>
    </div>

    <div class="section">
        <h2>数学小工具</h2>
        <input type="number" id="numberInput" placeholder="输入一个数字">
        <br>
        <button onclick="calculateSquare()">计算平方</button>
        <p id="mathResult" class="result"></p>
    </div>

    <div class="footer">
        这里记录我的项目、学习笔记和作品
    </div>
</div>

<script>
function showAbout(){
    alert("你好，我是 Wang，一名热爱数学、编程和个人成长的学生！");
}

function submitMessage(){
    let message = document.getElementById("messageInput").value;

    if(message.trim() === ""){
        document.getElementById("messageResult").innerHTML = "请先输入留言哦！";
    }else{
        document.getElementById("messageResult").innerHTML = "感谢你的留言：" + message;
    }
}

function calculateSquare(){
    let number = document.getElementById("numberInput").value;

    if(number === ""){
        document.getElementById("mathResult").innerHTML = "请先输入一个数字。";
    }else{
        document.getElementById("mathResult").innerHTML = number + "² = " + number * number;
    }
}

function changeTheme(){
    const colors = [
        "linear-gradient(-45deg,#667eea,#764ba2,#6dd5ed,#2193b0)",
        "linear-gradient(-45deg,#ff9a9e,#fad0c4,#fbc2eb,#a18cd1)",
        "linear-gradient(-45deg,#11998e,#38ef7d,#00c9ff,#92fe9d)",
        "linear-gradient(-45deg,#232526,#414345,#0f2027,#2c5364)"
    ];

    let randomColor = colors[Math.floor(Math.random() * colors.length)];
    document.body.style.background = randomColor;
    document.body.style.backgroundSize = "400% 400%";
}
</script>

</body>
</html>
