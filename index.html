<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wang's Personal Website</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:"Microsoft YaHei",sans-serif;
    min-height:100vh;
    color:white;
    padding:25px 15px;
    overflow-x:hidden;
    background:
        radial-gradient(circle at 20% 20%, rgba(0,255,255,0.25), transparent 25%),
        radial-gradient(circle at 80% 80%, rgba(255,0,255,0.25), transparent 25%),
        radial-gradient(circle at 50% 50%, rgba(255,255,255,0.08), transparent 35%),
        linear-gradient(135deg,#050816,#0a192f,#112240,#1a1a40);
    background-size:300% 300%;
    animation:bgMove 12s ease infinite;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background-image:
        radial-gradient(white 1px, transparent 1px),
        radial-gradient(white 1px, transparent 1px);
    background-size:60px 60px,100px 100px;
    background-position:0 0,30px 30px;
    opacity:0.18;
    animation:stars 30s linear infinite;
    pointer-events:none;
}

@keyframes bgMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

@keyframes stars{
    from{transform:translateY(0);}
    to{transform:translateY(-200px);}
}

.card{
    max-width:900px;
    margin:auto;
    background:rgba(255,255,255,0.10);
    backdrop-filter:blur(16px);
    border:1px solid rgba(255,255,255,0.18);
    border-radius:28px;
    padding:32px;
    text-align:center;
    box-shadow:
        0 0 30px rgba(0,255,255,0.15),
        0 8px 32px rgba(0,0,0,0.35);
    position:relative;
    z-index:1;
}

h1{
    font-size:3.2em;
    margin-bottom:10px;
    text-shadow:0 0 18px rgba(0,255,255,0.7);
}

.subtitle{
    font-size:1.3em;
    margin-bottom:20px;
}

.typing{
    margin:20px auto;
    width:0;
    overflow:hidden;
    white-space:nowrap;
    border-right:3px solid white;
    font-size:1.3em;
    animation:typing 4s steps(28,end) infinite alternate, blink .8s infinite;
}

@keyframes typing{
    from{width:0;}
    to{width:280px;}
}

@keyframes blink{
    50%{border-color:transparent;}
}

.skill{
    display:inline-block;
    margin:8px;
    padding:10px 18px;
    border-radius:25px;
    background:rgba(255,255,255,0.18);
    border:1px solid rgba(255,255,255,0.2);
    transition:.3s;
}

.skill:hover{
    transform:scale(1.08);
    box-shadow:0 0 18px rgba(0,255,255,0.45);
}

.section{
    margin-top:28px;
    padding-top:20px;
    border-top:1px solid rgba(255,255,255,0.25);
}

.section p{
    line-height:1.8;
    margin:8px 0;
}

button{
    margin:8px;
    padding:10px 18px;
    border:none;
    border-radius:25px;
    background:linear-gradient(135deg,#00c6ff,#7f00ff);
    color:white;
    cursor:pointer;
    transition:.3s;
    box-shadow:0 0 14px rgba(0,198,255,0.45);
}

button:hover{
    transform:scale(1.08);
    box-shadow:0 0 24px rgba(255,0,255,0.7);
}

.gallery{
    margin-top:20px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:16px;
}

.gallery img{
    width:100%;
    height:220px;
    object-fit:cover;
    border-radius:18px;
    box-shadow:0 6px 18px rgba(0,0,0,0.45);
    cursor:pointer;
    transition:.3s;
}

.gallery img:hover{
    transform:scale(1.05);
    box-shadow:0 0 25px rgba(0,255,255,0.55);
}

input{
    width:80%;
    max-width:320px;
    padding:10px;
    border:none;
    border-radius:20px;
    text-align:center;
    margin-top:10px;
    outline:none;
}

.result{
    margin-top:12px;
    min-height:25px;
}

.modal{
    display:none;
    position:fixed;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.9);
    justify-content:center;
    align-items:center;
    z-index:999;
}

.modal img{
    max-width:92%;
    max-height:85%;
    border-radius:20px;
}

.close{
    position:absolute;
    top:25px;
    right:35px;
    font-size:42px;
    cursor:pointer;
}

.footer{
    margin-top:30px;
    opacity:.9;
}

@media(max-width:600px){
    h1{font-size:2.4em;}
    .typing{font-size:1.1em;}
    .gallery img{height:180px;}
}
</style>
</head>
