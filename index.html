<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wang's Personal Website</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:"Microsoft YaHei",sans-serif;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    background:linear-gradient(-45deg,#667eea,#764ba2,#6dd5ed,#2193b0);
    background-size:400% 400%;
    animation:gradientBG 12s ease infinite;
}

@keyframes gradientBG{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.card{
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(10px);
    padding:40px;
    border-radius:20px;
    text-align:center;
    color:white;
    box-shadow:0 8px 32px rgba(0,0,0,0.2);
    animation:fadeIn 1.5s ease;
    max-width:600px;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

h1{
    font-size:3em;
    margin-bottom:10px;
}

.subtitle{
    font-size:1.3em;
    margin-bottom:20px;
    color:#f5f5f5;
}

.typing{
    border-right:3px solid white;
    white-space:nowrap;
    overflow:hidden;
    width:0;
    margin:20px auto;
    font-size:1.4em;
    animation:
        typing 4s steps(25,end) infinite alternate,
        blink .8s infinite;
}

@keyframes typing{
    from{width:0}
    to{width:250px}
}

@keyframes blink{
    50%{border-color:transparent}
}

.skills{
    margin-top:20px;
}

.skill{
    display:inline-block;
    margin:8px;
    padding:10px 20px;
    border-radius:30px;
    background:rgba(255,255,255,0.2);
    transition:0.3s;
}

.skill:hover{
    transform:scale(1.1);
    background:rgba(255,255,255,0.35);
}

.footer{
    margin-top:25px;
    font-size:0.95em;
    opacity:0.9;
}
</style>

</head>
<body>

<div class="card">
    <h1>Wang</h1>

    <div class="subtitle">
        Student & Lifelong Learner
    </div>

    <p>
        你好，我是 Wang，一名学生。
    </p>

    <div class="typing">
        Learning • Coding • Growing
    </div>

    <div class="skills">
        <span class="skill">📐 Mathematics</span>
        <span class="skill">💻 Programming</span>
        <span class="skill">🚀 Personal Growth</span>
    </div>

    <div class="footer">
        这里记录我的项目、学习笔记和作品
    </div>
</div>

</body>
</html>
