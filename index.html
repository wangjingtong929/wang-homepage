<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wang | Personal Website</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    font-family:"Segoe UI",sans-serif;

    background:
    linear-gradient(
        rgba(0,0,0,.35),
        rgba(0,0,0,.65)
    ),
    url("https://images.unsplash.com/photo-1507525428034-b723cf961d3e");

    background-size:cover;
    background-position:center;
    background-attachment:fixed;

    overflow:hidden;
}

/* 星空 */

.stars{
    position:absolute;
    width:100%;
    height:100%;
}

.stars span{
    position:absolute;
    width:3px;
    height:3px;
    background:white;
    border-radius:50%;

    animation:twinkle 3s infinite;
}

@keyframes twinkle{
    50%{
        opacity:.3;
    }
}

/* 海浪 */

.wave{
    position:absolute;
    bottom:0;
    width:200%;
    height:150px;

    background:
    rgba(255,255,255,.08);

    border-radius:45%;

    animation:moveWave 15s linear infinite;
}

@keyframes moveWave{
    from{
        transform:translateX(0);
    }

    to{
        transform:translateX(-50%);
    }
}

/* 主面板 */

.card{

    position:relative;

    width:90%;
    max-width:900px;

    padding:50px;

    text-align:center;

    border-radius:30px;

    background:rgba(10,20,50,.45);

    backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,.2);

    box-shadow:
    0 0 25px rgba(0,180,255,.5),
    0 0 80px rgba(0,180,255,.2);

    color:white;

    z-index:2;
}

.avatar{

    width:150px;
    height:150px;

    margin:auto;
    margin-bottom:25px;

    border-radius:50%;

    overflow:hidden;

    border:4px solid #00c3ff;

    box-shadow:
    0 0 25px #00c3ff;
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

h1{

    font-size:60px;

    margin-bottom:15px;

    text-shadow:
    0 0 10px #00c3ff,
    0 0 20px #00c3ff,
    0 0 40px #00c3ff;
}

.subtitle{
    font-size:22px;
    color:#d8f3ff;
    margin-bottom:25px;
}

.description{

    line-height:1.8;

    font-size:18px;

    margin-bottom:30px;
}

.tags{

    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
}

.tag{

    padding:10px 20px;

    border-radius:999px;

    background:rgba(255,255,255,.12);

    border:1px solid rgba(255,255,255,.2);

    transition:.3s;
}

.tag:hover{

    transform:translateY(-5px);

    box-shadow:
    0 0 20px #00c3ff;
}

/* 船 */

.ship{

    position:absolute;

    bottom:70px;

    right:8%;

    font-size:80px;

    animation:shipMove 6s ease-in-out infinite;

    z-index:1;
}

@keyframes shipMove{

    50%{
        transform:
        translateY(-15px)
        rotate(-3deg);
    }
}

</style>
</head>

<body>

<div class="stars">
<span style="top:10%;left:15%"></span>
<span style="top:20%;left:40%"></span>
<span style="top:15%;left:70%"></span>
<span style="top:35%;left:85%"></span>
<span style="top:60%;left:10%"></span>
<span style="top:70%;left:55%"></span>
<span style="top:80%;left:75%"></span>
<span style="top:25%;left:90%"></span>
</div>

<div class="wave"></div>

<div class="ship">⛵</div>

<div class="card">

<div class="avatar">
<img src="images/IMG_20260602_200725.jpg">
</div>

<h1>Wang</h1>

<div class="subtitle">
Student · Explorer · Dream Chaser
</div>

<div class="description">
你好，我是 Wang，一名学生。<br><br>

我关注数学、编程与个人成长。<br>

这里记录我的项目、学习笔记和作品。<br><br>

像航海一样不断探索未知，
在知识的海洋中寻找属于自己的方向。
</div>

<div class="tags">
<div class="tag">📚 Mathematics</div>
<div class="tag">💻 Programming</div>
<div class="tag">🚀 Projects</div>
<div class="tag">🌱 Growth</div>
</div>

</div>

</body>
</html>
